name: Build Hafez Matama

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Windows 32-bit installer
        run: npm run build:win32 -- --publish never

      - name: Upload 32-bit installer
        uses: actions/upload-artifact@v4
        with:
          name: Hafez-Matama-Windows-32bit
          path: dist/*.exe
          if-no-files-found: error
